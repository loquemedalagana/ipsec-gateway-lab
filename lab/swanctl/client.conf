# client 쪽 IKE 설정. "누구와, 어떻게 인증하고, 어떤 트래픽을 보호할지"만 적는다.
# 키와 SPI 는 여기에 없다 — IKE 가 협상해서 커널에 넣는다.
connections {
  gw {
    version = 2                                   # IKEv2
    local_addrs  = 10.0.1.2
    remote_addrs = 10.0.1.1
    proposals = aes256gcm16-prfsha256-x25519      # IKE SA 보호(AES-GCM) + 키 교환(X25519)
    mobike = no                                   # 주소가 바뀌지 않는 구성이라 끈다. IKE 가 UDP 500 에만 머문다
    local {                                       # 사전공유키(PSK)로 서로 인증
      auth = psk
      id = client
    }
    remote {
      auth = psk
      id = gw
    }
    children {
      inside {
        mode = tunnel
        local_ts  = 10.9.0.2/32                   # 터널 안 주소
        remote_ts = 10.0.2.0/23                   # 보호 대역
        esp_proposals = aes128gcm16-x25519        # ESP: AES-GCM. 키를 바꿀 때마다 키 교환을 새로 한다(PFS)
        replay_window = 32
        start_action = trap                       # 정책을 먼저 걸어 둔다: SA 가 없으면 평문으로 나가지 않고 버려진다
      }
    }
  }
}

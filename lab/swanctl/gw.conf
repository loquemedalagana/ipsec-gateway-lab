# gw 쪽 IKE 설정. client.conf 와 방향만 반대다.
connections {
  client {
    version = 2
    local_addrs  = 10.0.1.1
    remote_addrs = 10.0.1.2
    proposals = aes256gcm16-prfsha256-x25519
    mobike = no
    local {
      auth = psk
      id = gw
    }
    remote {
      auth = psk
      id = client
    }
    children {
      inside {
        mode = tunnel
        local_ts  = 10.0.2.0/23
        remote_ts = 10.9.0.2/32
        esp_proposals = aes128gcm16-x25519
        replay_window = 32
        start_action = trap
      }
    }
  }
}
